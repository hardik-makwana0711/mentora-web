<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mentora — öğrenme ve mentorluk platformu" />
    <title>Mentora</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('mentora:theme');
          document.documentElement.dataset.theme =
            theme === 'light' || theme === 'dark' ? theme : 'dark';
          var locale = localStorage.getItem('mentora:locale');
          if (locale === 'en' || locale === 'tr') document.documentElement.lang = locale;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
