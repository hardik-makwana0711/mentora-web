# Host-level Nginx config for mentora-web on the EC2 instance.
# Terminates TLS and reverse-proxies to the mentora-web Docker container
# (published on 127.0.0.1:8080 by docker-compose.yml — see deploy/DOCKER.md).
#
# Install: sudo cp deploy/mentora-web.conf /etc/nginx/conf.d/mentora-web.conf
#          sudo nginx -t && sudo systemctl reload nginx

# HTTP server - redirect all traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name mentoratr.com www.mentoratr.com 43.205.26.79;

    # Allow Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/mentora-web/dist;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mentoratr.com www.mentoratr.com 43.205.26.79;

    ssl_certificate /etc/letsencrypt/live/mentoratr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mentoratr.com/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
