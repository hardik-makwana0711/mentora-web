# HTTP server - redirect all traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name mentoratr.com www.mentoratr.com 43.205.26.79;

    # Allow Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/mentora-web/dist;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mentoratr.com www.mentoratr.com 43.205.26.79;

    ssl_certificate /etc/letsencrypt/live/mentoratr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mentoratr.com/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /var/www/mentora-web/dist;
    index index.html;

    # gzip built assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-cache hashed build assets
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Never cache index.html
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
