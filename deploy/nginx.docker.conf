# Nginx config baked into the mentora-web container image (see ../Dockerfile).
# Serves the built SPA on plain HTTP inside the container — TLS is terminated
# by the host Nginx (deploy/mentora-web.conf), which reverse-proxies to this
# container. No server_name / SSL here on purpose.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-cache hashed build assets (Vite fingerprints filenames)
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Never cache index.html — deploys must take effect immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: react-router uses the History API, so every unknown path
    # must resolve to index.html with a 200, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
