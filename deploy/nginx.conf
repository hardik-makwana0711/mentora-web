# Nginx config for mentora-web (Vite + React Router SPA) on an EC2 instance.
#
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/mentora-web
#          sudo ln -s /etc/nginx/sites-available/mentora-web /etc/nginx/sites-enabled/mentora-web
#          sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN and confirm the root path matches where dist/ is deployed.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    root /var/www/mentora-web/dist;
    index index.html;

    # gzip built assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-cache hashed build assets (Vite fingerprints filenames)
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Never cache index.html — it must always be revalidated so deploys take
    # effect immediately instead of serving a stale shell from browser cache.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: react-router uses the History API, so every unknown path
    # must resolve to index.html with a 200, not a 404/redirect.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
